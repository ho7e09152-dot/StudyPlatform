plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.studyworkspace'
version = '0.1.0-SNAPSHOT'
description = 'GitLab integration spike for Study Workspace'

java {
	sourceCompatibility = '21'
	targetCompatibility = '21'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webclient'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'io.micrometer:micrometer-tracing-bridge-otel'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.yaml:snakeyaml'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webclient-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('bootRun') {
	def envFile = file('.env')
	if (envFile.exists()) {
		envFile.eachLine('UTF-8') { rawLine ->
			def line = rawLine.trim()
			if (!line || line.startsWith('#') || !line.contains('=')) {
				return
			}

			def separator = line.indexOf('=')
			def key = line.substring(0, separator).trim()
			def value = line.substring(separator + 1).trim()
			if (!(key ==~ /[A-Za-z_][A-Za-z0-9_]*/)) {
				return
			}
			if (value.length() >= 2 && ((value.startsWith('"') && value.endsWith('"'))
				|| (value.startsWith("'") && value.endsWith("'")))) {
				value = value.substring(1, value.length() - 1)
			}

			if (System.getenv(key) == null) {
				environment key, value
			}
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
}
