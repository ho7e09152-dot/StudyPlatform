spring:
  application:
    name: study-workspace-backend
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./.data/study-platform;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
    timeout: 8h

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  demo:
    persistence-path: ${WORKSPACE_STATE_FILE:.data/workspaces-production.json}
    seed-enabled: ${DEMO_SEED_ENABLED:false}
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  security:
    token-encryption-key: ${OAUTH_TOKEN_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      read-per-minute: ${RATE_LIMIT_READ_PER_MINUTE:240}
      write-per-minute: ${RATE_LIMIT_WRITE_PER_MINUTE:60}
  gitlab:
    base-url: ${GITLAB_BASE_URL:https://lab.ssafy.com}
    access-token: ${GITLAB_ACCESS_TOKEN:}
    project-id: ${GITLAB_PROJECT_ID:}
    default-ref: ${GITLAB_DEFAULT_REF:}
    request-timeout: 10s
    oauth:
      client-id: ${GITLAB_OAUTH_CLIENT_ID:}
      client-secret: ${GITLAB_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${GITLAB_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/auth/gitlab/callback}
      scope: api
      state-ttl: 10m
