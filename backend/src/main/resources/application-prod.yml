spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    locations: classpath:db/migration,classpath:db/production
  session:
    jdbc:
      initialize-schema: never
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true

app:
  security:
    token-encryption-key: ${OAUTH_TOKEN_ENCRYPTION_KEY}

logging:
  structured:
    format:
      console: logstash

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:0.1}
