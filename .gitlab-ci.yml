stages:
  - validate
  - test

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

default:
  interruptible: true

api_contract:
  stage: validate
  image: node:22-bookworm-slim
  cache:
    key: redocly-npm-cache
    paths:
      - .npm/
  script:
    - npx --yes --cache .npm @redocly/cli lint docs/api/openapi.yaml --config .redocly.yaml

repository_hygiene:
  stage: validate
  image: alpine:3.21
  before_script:
    - apk add --no-cache git
  script:
    - ./scripts/check-no-secrets.sh

frontend_lint:
  stage: validate
  image: node:22-bookworm-slim
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm/
  before_script:
    - cd frontend
    - npm ci --cache ../.npm --prefer-offline
  script:
    - npm run lint

frontend_audit:
  stage: validate
  image: node:22-bookworm-slim
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm/
  before_script:
    - cd frontend
    - npm ci --cache ../.npm --prefer-offline
  script:
    - npm audit --omit=dev --audit-level=high

frontend_test:
  stage: test
  image: node:22-bookworm-slim
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm/
  before_script:
    - cd frontend
    - npm ci --cache ../.npm --prefer-offline
  script:
    - npm run test
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - frontend/dist/

frontend_e2e:
  stage: test
  image: node:22-bookworm-slim
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm/
      - .cache/ms-playwright/
  variables:
    PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/ms-playwright"
  before_script:
    - cd frontend
    - npm ci --cache ../.npm --prefer-offline
    - npx playwright install --with-deps chromium
  script:
    - npm run test:e2e
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit:
        - frontend/test-results/e2e-junit.xml
    paths:
      - frontend/playwright-report/
      - frontend/test-results/

backend_test:
  stage: test
  image: eclipse-temurin:21-jdk
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  cache:
    key:
      files:
        - backend/gradle/wrapper/gradle-wrapper.properties
        - backend/build.gradle
    paths:
      - .gradle/caches/
      - .gradle/wrapper/
  before_script:
    - cd backend
    - chmod +x gradlew
  script:
    - ./gradlew --no-daemon clean test
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit:
        - backend/build/test-results/test/TEST-*.xml
    paths:
      - backend/build/reports/tests/test/
