<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Study Workspace 예정 아키텍처</title>
  <desc id="description">React 프론트엔드가 Spring Boot API를 호출하고, Spring Boot가 PostgreSQL, Redis, GitLab OAuth와 REST API를 연결하는 구조</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfaff"/>
      <stop offset="100%" stop-color="#f4f1f9"/>
    </linearGradient>
    <linearGradient id="frontendGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f1ff"/>
    </linearGradient>
    <linearGradient id="backendGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffefe"/>
      <stop offset="100%" stop-color="#f3effb"/>
    </linearGradient>
    <linearGradient id="gitlabGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff9f4"/>
      <stop offset="100%" stop-color="#fff1e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#32284b" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#7865a8"/>
    </marker>
    <style>
      text {
        font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;
        fill: #292333;
      }
      .eyebrow {
        fill: #6d52b5;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 3px;
      }
      .title {
        font-size: 42px;
        font-weight: 800;
        letter-spacing: -1.5px;
      }
      .subtitle {
        fill: #746d7f;
        font-size: 18px;
      }
      .layer-label {
        fill: #746d7f;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 2px;
      }
      .card-title {
        font-size: 25px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .card-subtitle {
        fill: #7b7386;
        font-size: 15px;
      }
      .module-title {
        font-size: 15px;
        font-weight: 800;
      }
      .module-detail {
        fill: #81798b;
        font-size: 12px;
      }
      .pill {
        fill: #6653a4;
        font-size: 12px;
        font-weight: 750;
      }
      .arrow-label {
        fill: #6e657a;
        font-size: 12px;
        font-weight: 700;
      }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1475" cy="70" r="170" fill="#efe9fb" opacity="0.65"/>
  <circle cx="80" cy="820" r="190" fill="#f2edf8" opacity="0.75"/>

  <text x="78" y="64" class="eyebrow">STUDY WORKSPACE</text>
  <text x="78" y="112" class="title">예정 서비스 아키텍처</text>
  <text x="78" y="145" class="subtitle">GitLab을 학습 기록의 원본으로 유지하고, Spring Boot가 안전한 연결 계층을 담당합니다.</text>

  <rect x="1288" y="54" width="234" height="42" rx="21" fill="#ffffff" stroke="#ded7eb"/>
  <circle cx="1313" cy="75" r="6" fill="#6d52b5"/>
  <text x="1329" y="81" font-size="14" font-weight="750" fill="#665b72">PLANNED ARCHITECTURE</text>

  <!-- User -->
  <text x="78" y="221" class="layer-label">USER</text>
  <rect x="78" y="244" width="174" height="286" rx="28" fill="#ffffff" stroke="#ddd6e8" filter="url(#shadow)"/>
  <circle cx="165" cy="327" r="46" fill="#6d52b5"/>
  <circle cx="165" cy="313" r="14" fill="#ffffff" opacity="0.95"/>
  <path d="M139 351c3-17 14-26 26-26s23 9 26 26" fill="#ffffff" opacity="0.95"/>
  <text x="165" y="404" text-anchor="middle" class="card-title" font-size="22">스터디 멤버</text>
  <text x="165" y="431" text-anchor="middle" class="card-subtitle">일정 확인 · 항목 제출</text>
  <rect x="103" y="463" width="124" height="34" rx="17" fill="#f2edf9"/>
  <text x="165" y="485" text-anchor="middle" class="pill">WEB / MOBILE</text>

  <!-- Frontend -->
  <text x="305" y="174" class="layer-label">CLIENT</text>
  <rect x="305" y="197" width="350" height="430" rx="30" fill="url(#frontendGradient)" stroke="#d9d1e8" filter="url(#shadow)"/>
  <rect x="331" y="224" width="52" height="52" rx="16" fill="#eee7fb"/>
  <path d="M347 250h20M357 240v20" stroke="#6d52b5" stroke-width="3" stroke-linecap="round"/>
  <text x="399" y="249" class="card-title">React Frontend</text>
  <text x="399" y="273" class="card-subtitle" font-size="13">Next.js · TypeScript · Responsive UI</text>

  <rect x="331" y="310" width="298" height="62" rx="16" fill="#ffffff" stroke="#e2dcec"/>
  <circle cx="357" cy="341" r="10" fill="#6d52b5" opacity="0.16"/>
  <path d="M351 341h12M357 335v12" stroke="#6d52b5" stroke-width="2" stroke-linecap="round"/>
  <text x="381" y="337" class="module-title">오늘 · 일정</text>
  <text x="381" y="357" class="module-detail">학습 항목, 마감, 팀 진행률</text>

  <rect x="331" y="386" width="298" height="62" rx="16" fill="#ffffff" stroke="#e2dcec"/>
  <circle cx="357" cy="417" r="10" fill="#6d52b5" opacity="0.16"/>
  <path d="M350 421l5-7 5 4 5-9" fill="none" stroke="#6d52b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="381" y="413" class="module-title">기록 · 점수</text>
  <text x="381" y="433" class="module-detail">일별·월별 통계와 멤버 순위</text>

  <rect x="331" y="462" width="298" height="62" rx="16" fill="#ffffff" stroke="#e2dcec"/>
  <circle cx="357" cy="493" r="10" fill="#6d52b5" opacity="0.16"/>
  <path d="M350 488h14v12h-14zM353 485h8" fill="none" stroke="#6d52b5" stroke-width="2" stroke-linejoin="round"/>
  <text x="381" y="489" class="module-title">저장소 · 설정</text>
  <text x="381" y="509" class="module-detail">파일 미리보기와 Workspace 관리</text>

  <rect x="331" y="548" width="134" height="38" rx="19" fill="#eee8fa"/>
  <text x="398" y="572" text-anchor="middle" class="pill">HttpOnly Session</text>
  <rect x="475" y="548" width="154" height="38" rx="19" fill="#edf6f4"/>
  <text x="552" y="572" text-anchor="middle" font-size="12" font-weight="750" fill="#3d7175">GitLab Token 없음</text>

  <!-- Backend -->
  <text x="723" y="126" class="layer-label">APPLICATION SERVER</text>
  <rect x="723" y="149" width="456" height="522" rx="32" fill="url(#backendGradient)" stroke="#d6cde7" filter="url(#shadow)"/>
  <rect x="751" y="176" width="54" height="54" rx="17" fill="#e9e2f8"/>
  <path d="M767 204h22M778 193v22" stroke="#624aa8" stroke-width="3" stroke-linecap="round"/>
  <text x="822" y="201" class="card-title">Spring Boot</text>
  <text x="822" y="226" class="card-subtitle" font-size="14">REST API · Security · JPA · WebClient</text>

  <rect x="751" y="265" width="191" height="98" rx="18" fill="#ffffff" stroke="#dfd7ec"/>
  <text x="770" y="294" class="module-title">인증 · Workspace</text>
  <text x="770" y="319" class="module-detail">OAuth · 토큰 암호화</text>
  <text x="770" y="340" class="module-detail">프로젝트 · 멤버십</text>

  <rect x="956" y="265" width="195" height="98" rx="18" fill="#ffffff" stroke="#dfd7ec"/>
  <text x="975" y="294" class="module-title">일정 · 저장소</text>
  <text x="975" y="319" class="module-detail">session.yml · revision</text>
  <text x="975" y="340" class="module-detail">tree · 파일 조회</text>

  <rect x="751" y="377" width="400" height="98" rx="18" fill="#ffffff" stroke="#dfd7ec"/>
  <text x="770" y="406" class="module-title">제출 · Dashboard · Records</text>
  <text x="770" y="431" class="module-detail">멤버 파일 병합 · 완료율 · 일별/월별 기록</text>
  <text x="770" y="452" class="module-detail">점수 순위 · last_commit_id 충돌 검사 · 제한된 재시도</text>

  <rect x="751" y="493" width="400" height="70" rx="18" fill="#eee8fa" stroke="#d6c9ec"/>
  <text x="770" y="520" class="module-title" fill="#5d459e">Common GitLab Client / Port</text>
  <text x="770" y="543" class="module-detail">프로젝트와 경로 검증 · 오류 변환 · 요청 제한 대응</text>

  <rect x="751" y="582" width="126" height="38" rx="19" fill="#ffffff" stroke="#ddd5e8"/>
  <text x="814" y="606" text-anchor="middle" class="pill">Spring Security</text>
  <rect x="888" y="582" width="110" height="38" rx="19" fill="#ffffff" stroke="#ddd5e8"/>
  <text x="943" y="606" text-anchor="middle" class="pill">WebClient</text>
  <rect x="1009" y="582" width="142" height="38" rx="19" fill="#ffffff" stroke="#ddd5e8"/>
  <text x="1080" y="606" text-anchor="middle" class="pill">Spring Data JPA</text>

  <!-- GitLab -->
  <text x="1240" y="174" class="layer-label">SOURCE OF TRUTH</text>
  <rect x="1240" y="197" width="282" height="430" rx="30" fill="url(#gitlabGradient)" stroke="#ecd3c0" filter="url(#shadow)"/>
  <path d="M1300 230l16 44h-64l16-44 8 24 8-24 8 24z" fill="#e36f35" opacity="0.96"/>
  <text x="1328" y="250" class="card-title">GitLab</text>
  <text x="1328" y="274" class="card-subtitle" font-size="13">Self-Managed · GitLab.com</text>

  <rect x="1267" y="310" width="228" height="70" rx="17" fill="#ffffff" stroke="#efd8c8"/>
  <text x="1286" y="338" class="module-title">OAuth 2.0</text>
  <text x="1286" y="360" class="module-detail">사용자 인증과 권한 위임</text>

  <rect x="1267" y="394" width="228" height="70" rx="17" fill="#ffffff" stroke="#efd8c8"/>
  <text x="1286" y="422" class="module-title">GitLab REST API</text>
  <text x="1286" y="444" class="module-detail">Projects · Members · Files</text>

  <rect x="1267" y="478" width="228" height="112" rx="17" fill="#fff8f2" stroke="#e8c5aa"/>
  <text x="1286" y="507" class="module-title">Study Repository</text>
  <text x="1286" y="532" class="module-detail">session.yml</text>
  <text x="1286" y="553" class="module-detail">member-a.md · member-b.md</text>
  <text x="1286" y="574" class="module-detail">Git commit history</text>

  <!-- Infrastructure -->
  <text x="723" y="723" class="layer-label">DATA &amp; SESSION</text>
  <rect x="723" y="744" width="218" height="100" rx="22" fill="#ffffff" stroke="#d9d1e5" filter="url(#shadow)"/>
  <ellipse cx="765" cy="778" rx="19" ry="8" fill="#edf0fb" stroke="#6374b0" stroke-width="2"/>
  <path d="M746 778v26c0 5 9 8 19 8s19-3 19-8v-26M746 791c0 5 9 8 19 8s19-3 19-8" fill="none" stroke="#6374b0" stroke-width="2"/>
  <text x="801" y="779" class="module-title">PostgreSQL</text>
  <text x="801" y="801" class="module-detail" font-size="11">사용자 · Workspace</text>
  <text x="801" y="820" class="module-detail" font-size="11">암호화 토큰 · 감사 로그</text>

  <rect x="961" y="744" width="218" height="100" rx="22" fill="#ffffff" stroke="#d9d1e5" filter="url(#shadow)"/>
  <rect x="987" y="773" width="38" height="38" rx="10" fill="#f4e8ed"/>
  <path d="M994 784h24M994 792h24M994 800h24" stroke="#a15169" stroke-width="2" stroke-linecap="round"/>
  <text x="1041" y="779" class="module-title">Redis</text>
  <text x="1041" y="801" class="module-detail" font-size="11">세션 · OAuth state</text>
  <text x="1041" y="820" class="module-detail" font-size="11">짧은 캐시 · 분산 락</text>

  <!-- Arrows -->
  <path d="M252 386 H294" fill="none" stroke="#7865a8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="273" y="371" text-anchor="middle" class="arrow-label">접속</text>

  <path d="M655 385 H711" fill="none" stroke="#7865a8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="643" y="333" width="79" height="34" rx="17" fill="#f8f5fc" stroke="#ded6e9"/>
  <text x="682" y="355" text-anchor="middle" class="arrow-label">REST API</text>

  <path d="M1179 385 H1228" fill="none" stroke="#c47145" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1168" y="333" width="74" height="34" rx="17" fill="#fff8f2" stroke="#ead2bf"/>
  <text x="1205" y="355" text-anchor="middle" class="arrow-label" fill="#a75d38">OAuth</text>

  <path d="M838 671 V730" fill="none" stroke="#7865a8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1068 671 V730" fill="none" stroke="#7865a8" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="1520" y="870" text-anchor="end" fill="#9a92a4" font-size="12">Study Workspace · Architecture v1</text>
</svg>
