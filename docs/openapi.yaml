          $ref: "#/components/responses/InvalidRequest"

  /workspaces/{workspaceId}/scores:
    get:
      tags: [Analytics]
      summary: 기간별 내 점수와 멤버 순위
      operationId: getScores
      x-owner: member-3
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: 점수 규칙과 순위
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreboardResponse"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SessionDate:
      name: date
      in: path
      required: true
      schema:
        type: string
        format: date
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        pattern: ^item-[a-f0-9]{6,16}$
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    InvalidRequest:
      description: 요청 형식 또는 비즈니스 입력값 오류
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            code: INVALID_REQUEST
            message: 요청값을 확인해 주세요.
            details:
              field: title
            requestId: req_01J
            timestamp: "2026-07-25T12:00:00Z"
    InvalidPath:
      description: 허용되지 않은 저장소 경로
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            code: FILE_PATH_NOT_ALLOWED
            message: 허용되지 않은 저장소 경로입니다.
            timestamp: "2026-07-25T12:00:00Z"
    AuthRequired:
      description: 로그인 또는 유효한 세션 필요
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            code: AUTH_REQUIRED
            message: 로그인이 필요합니다.
            timestamp: "2026-07-25T12:00:00Z"
    WorkspaceAccessDenied:
      description: Workspace 활성 멤버가 아님
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            code: WORKSPACE_ACCESS_DENIED
            message: Workspace에 접근할 수 없습니다.
            timestamp: "2026-07-25T12:00:00Z"
    GitLabAccessDenied:
      description: GitLab 프로젝트 권한 부족
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            code: GITLAB_PROJECT_ACCESS_DENIED
            message: GitLab 프로젝트에 접근할 수 없습니다.
            timestamp: "2026-07-25T12:00:00Z"
    NotFound:
      description: Workspace, Session, Item 또는 파일을 찾지 못함
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            code: RESOURCE_NOT_FOUND
            message: 요청한 리소스를 찾지 못했습니다.
            timestamp: "2026-07-25T12:00:00Z"
    Conflict:
      description: revision, lastCommitId 또는 중복 리소스 충돌
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            code: SESSION_REVISION_CONFLICT
            message: 다른 사용자가 먼저 수정했습니다. 최신 내용을 확인해 주세요.
            details:
              expectedRevision: 3
              actualRevision: 4
            timestamp: "2026-07-25T12:00:00Z"
    Unprocessable:
      description: 요청 형식은 맞지만 도메인 규칙 위반
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            code: SUBMISSION_TYPE_MISMATCH
            message: 이 항목은 링크 제출만 허용합니다.
            timestamp: "2026-07-25T12:00:00Z"
    GitLabError:
      description: GitLab 인증·권한·네트워크·요청 제한 오류
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            code: GITLAB_API_ERROR
            message: GitLab 요청을 처리하지 못했습니다.
            requestId: req_01J
            timestamp: "2026-07-25T12:00:00Z"

  schemas:
    ApiErrorResponse:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: string
          description: 프론트 분기와 테스트에서 사용하는 안정적인 오류 코드
        message:
          type: string
          description: 사용자에게 표시 가능한 한국어 메시지
        details:
          type: object
          additionalProperties: true
          description: 필드 오류나 충돌 최신값
        requestId:
          type: string
          description: 로그 추적 ID
        timestamp:
          type: string
          format: date-time

    PageMeta:
      type: object
      required: [page, perPage, total]
      properties:
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer

    CurrentUserResponse:
      type: object
      required: [authenticated, mode, user]
      properties:
        authenticated:
          const: true
        mode:
          const: gitlab-oauth
        user:
          $ref: "#/components/schemas/AuthenticatedGitLabUser"
    UnauthenticatedResponse:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          const: false
    AuthenticatedGitLabUser:
      type: object
      required: [id, username, name]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        name:
          type: string
        avatarUrl:
          type: [string, "null"]
          format: uri
        webUrl:
          type: [string, "null"]
          format: uri

    GitLabProject:
      type: object
      required: [id, name, pathWithNamespace, visibility]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        pathWithNamespace:
          type: string
        defaultBranch:
          type: [string, "null"]
        visibility:
          type: string
        webUrl:
          type: string
          format: uri
        effectiveAccessLevel:
          type: integer
          description: GitLab access level, Developer는 30 이상
    GitLabProjectPageResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/GitLabProject"
        meta:
          $ref: "#/components/schemas/PageMeta"
    ConnectionCheckResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [readable, writable, alreadyConnected, checks]
          properties:
            readable:
              type: boolean
            writable:
              type: boolean
            alreadyConnected:
              type: boolean
            checks:
              type: array
              items:
                type: object
                required: [name, passed]
                properties:
                  name:
                    type: string
                  passed:
                    type: boolean
                  message:
                    type: string

    WorkspaceStatus:
      type: string
      enum: [ACTIVE, SOFT_DELETED]
    WorkspaceSummary:
      type: object
      required: [id, name, status, gitlabProjectPath, defaultBranch]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: "#/components/schemas/WorkspaceStatus"
        gitlabProjectPath:
          type: string
        defaultBranch:
          type: string
        deletedAt:
          type: [string, "null"]
          format: date-time
    Workspace:
      allOf:
        - $ref: "#/components/schemas/WorkspaceSummary"
        - type: object
          required: [gitlabProjectId, members, settings]
          properties:
            gitlabProjectId:
              type: integer
              format: int64
            members:
              type: array
              items:
                $ref: "#/components/schemas/WorkspaceMember"
            settings:
              $ref: "#/components/schemas/WorkspaceSettings"
    WorkspaceResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Workspace"
    WorkspaceSettings:
      type: object
      properties:
        notifications:
          type: object
          properties:
            deadline:
              type: boolean
            submission:
              type: boolean
            sessionChanged:
              type: boolean
    CreateWorkspaceRequest:
      type: object
      required:
        [name, gitlabProjectId, defaultBranch, selectedGitlabUserIds]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        gitlabProjectId:
          type: integer
          format: int64
        defaultBranch:
          type: string
          minLength: 1
        selectedGitlabUserIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            format: int64
        initializeRepository:
          type: boolean
          default: true
    UpdateWorkspaceRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        settings:
          $ref: "#/components/schemas/WorkspaceSettings"

    MemberStatus:
      type: string
      enum: [ACTIVE, LOST_PROJECT_ACCESS, INACTIVE]
    WorkspaceMember:
      type: object
      required:
        [userId, memberId, gitlabUserId, username, displayName, fileName, status]
      properties:
        userId:
          type: string
          format: uuid
        memberId:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{1,39}$
        gitlabUserId:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
        fileName:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{1,39}\.md$
        avatarUrl:
          type: [string, "null"]
          format: uri
        gitlabAccessLevel:
          type: integer
        status:
          $ref: "#/components/schemas/MemberStatus"
    MemberCandidate:
      type: object
      required: [gitlabUserId, username, displayName, accessLevel, selectable]
      properties:
        gitlabUserId:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
        accessLevel:
          type: integer
        selectable:
          type: boolean
        reason:
          type: [string, "null"]
    AddMemberRequest:
      type: object
      required: [gitlabUserId, memberId, fileName, displayName]
      properties:
        gitlabUserId:
          type: integer
          format: int64
        memberId:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{1,39}$
        fileName:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{1,39}\.md$
        displayName:
          type: string
          minLength: 1
          maxLength: 50
    MemberSyncResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [active, lostProjectAccess, newCandidates]
          properties:
            active:
              type: integer
            lostProjectAccess:
              type: integer
            newCandidates:
              type: integer

    WorkspaceSyncFailure:
      type: object
      required: [path, code, message]
      properties:
        path:
          type: string
          pattern: ^\d{6}/[A-Za-z0-9._-]+$
        code:
          type: string
          example: INVALID_SESSION_FILE
        message:
          type: string
    WorkspaceSyncResponse:
      type: object
      required: [workspace, importedSessions, removedSessions, importedSubmissions, removedSubmissions, failures, syncedAt]
      properties:
        workspace:
          $ref: "#/components/schemas/Workspace"
        importedSessions:
          type: integer
          minimum: 0
        removedSessions:
          type: integer
          minimum: 0
        importedSubmissions:
          type: integer
          minimum: 0
        removedSubmissions:
          type: integer
          minimum: 0
        failures:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceSyncFailure"
        syncedAt:
          type: string
          format: date-time

    SessionType:
      type: string
      enum: [algorithm, english, cs, free]
    SessionStatus:
      type: string
      enum: [active, cancelled]
    SubmitType:
      type: string
      enum: [link, text, code, mixed]
    StudyItem:
      type: object
      required: [id, order, title, submitType, required, status]
      properties:
        id:
          type: string
          pattern: ^item-[a-f0-9]{6,16}$
        order:
          type: integer
          minimum: 1
        title:
          type: string
        source:
          type: [string, "null"]
        url:
          type: [string, "null"]
          format: uri
        submitType:
          $ref: "#/components/schemas/SubmitType"
        required:
          type: boolean
        status:
          type: string
          enum: [active, cancelled]
    StudySession:
      type: object
      required:
        [date, folder, revision, type, title, description, status, deadline, items, lastCommitId]
      properties:
        date:
          type: string
          format: date
        folder:
          type: string
          pattern: ^\d{6}$
        revision:
          type: integer
          minimum: 1
        type:
          $ref: "#/components/schemas/SessionType"
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/SessionStatus"
        deadline:
          type: string
          format: date-time
        secondaryDeadline:
          type: [string, "null"]
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/StudyItem"
        lastCommitId:
          type: string
    SessionResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/StudySession"
    SessionItemDraft:
      type: object
      required: [title, submitType, required]
      properties:
        id:
          type: string
          description: 수정 시 기존 항목 유지에만 전달
        title:
          type: string
          minLength: 1
          maxLength: 120
        source:
          type: string
          maxLength: 80
        url:
          type: string
          format: uri
        submitType:
          $ref: "#/components/schemas/SubmitType"
        required:
          type: boolean
    CreateSessionRequest:
      type: object
      required: [date, type, title, description, deadline, items]
      properties:
        date:
          type: string
          format: date
        type:
          $ref: "#/components/schemas/SessionType"
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 500
        deadline:
          type: string
          format: date-time
        secondaryDeadline:
          type: [string, "null"]
          format: date-time
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SessionItemDraft"
    UpdateSessionRequest:
      allOf:
        - $ref: "#/components/schemas/CreateSessionRequest"
        - type: object
          required: [expectedRevision, lastCommitId, changeReason]
          properties:
            expectedRevision:
              type: integer
              minimum: 1
            lastCommitId:
              type: string
            changeReason:
              type: string
              minLength: 1
              maxLength: 300

    RepositoryTreeItem:
      type: object
      required: [id, name, type, path, mode]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [blob, tree]
        path:
          type: string
        mode:
          type: string
    RepositoryTreeResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RepositoryTreeItem"
        meta:
          $ref: "#/components/schemas/PageMeta"
    RepositoryFileResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [path, type, rawContent, lastCommitId, webUrl]
          properties:
            path:
              type: string
            type:
              type: string
              enum: [yaml, markdown, text, code]
            rawContent:
              type: string
            parsedContent:
              type: [object, "null"]
              additionalProperties: true
            lastCommitId:
              type: string
            webUrl:
              type: string
              format: uri

    SubmissionStatus:
      type: string
      enum: [NOT_SUBMITTED, SUBMITTED, UPDATED]
    ItemSubmission:
      type: object
      required: [itemId, type, value, submittedAt, updatedAt]
      properties:
        itemId:
          type: string
        type:
          $ref: "#/components/schemas/SubmitType"
        value:
          type: string
        language:
          type: [string, "null"]
        submittedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MemberSubmission:
      type: object
      required:
        [memberId, date, sessionRevision, submissions, filePath]
      properties:
        memberId:
          type: string
        date:
          type: string
          format: date
        sessionRevision:
          type: integer
        submissions:
          type: array
          items:
            $ref: "#/components/schemas/ItemSubmission"
        filePath:
          type: string
        lastCommitId:
          type: [string, "null"]
    MemberSubmissionResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/MemberSubmission"
    ItemSubmissionResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ItemSubmission"
    UpsertSubmissionRequest:
      type: object
      required: [type, value, commitMessage]
      properties:
        type:
          $ref: "#/components/schemas/SubmitType"
        value:
          type: string
          minLength: 1
          maxLength: 200000
        language:
          type: string
          maxLength: 30
        expectedFileCommitId:
          type: [string, "null"]
          description: 파일이 이미 존재할 때 필수
        commitMessage:
          type: string
          minLength: 1
          maxLength: 200
    SubmissionMutationResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [itemId, status, filePath, commitId, dashboard]
          properties:
            itemId:
              type: string
            status:
              $ref: "#/components/schemas/SubmissionStatus"
            filePath:
              type: string
            commitId:
              type: string
            dashboard:
              type: object
              required: [myCompletedItems, myRequiredItems, teamSubmissionRate]
              properties:
                myCompletedItems:
                  type: integer
                myRequiredItems:
                  type: integer
                teamSubmissionRate:
                  type: number

    MemberProgress:
      type: object
      required:
        [memberId, displayName, completedItems, requiredItems, completionRate, status]
      properties:
        memberId:
          type: string
        displayName:
          type: string
        completedItems:
          type: integer
        requiredItems:
          type: integer
        completionRate:
          type: number
        status:
          type: string
          enum: [NOT_STARTED, PARTIAL, COMPLETED]
        lastSubmittedAt:
          type: [string, "null"]
          format: date-time
    DashboardResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [session, metrics, me, members]
          properties:
            session:
              $ref: "#/components/schemas/StudySession"
            metrics:
              type: object
              required:
                [completedMembers, totalMembers, submittedItems, totalRequiredSubmissions, submissionRate]
              properties:
                completedMembers:
                  type: integer
                totalMembers:
                  type: integer
                submittedItems:
                  type: integer
                totalRequiredSubmissions:
                  type: integer
                submissionRate:
                  type: number
            me:
              $ref: "#/components/schemas/MemberProgress"
            members:
              type: array
              items:
                $ref: "#/components/schemas/MemberProgress"

    DailyRecord:
      type: object
      required: [date, hasSession, submissionRate, submittedItems]
      properties:
        date:
          type: string
          format: date
        hasSession:
          type: boolean
        submissionRate:
          type: number
        submittedItems:
          type: integer
    RecordsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [view, period, averageSubmissionRate, totalSubmissions, days]
          properties:
            view:
              type: string
              enum: [day, month]
            period:
              type: string
            averageSubmissionRate:
              type: number
            totalSubmissions:
              type: integer
            days:
              type: array
              items:
                $ref: "#/components/schemas/DailyRecord"

    ScoreEntry:
      type: object
      required:
        [rank, memberId, displayName, points, maxPoints, primaryCount, secondaryCount]
      properties:
        rank:
          type: integer
          minimum: 1
        memberId:
          type: string
        displayName:
          type: string
        points:
          type: integer
        maxPoints:
          type: integer
        primaryCount:
          type: integer
        secondaryCount:
          type: integer
    ScoreboardResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [from, to, rules, me, ranking]
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
            rules:
              type: object
              required: [primary, secondary, missed]
              properties:
                primary:
                  type: integer
                  const: 10
                secondary:
                  type: integer
                  const: 6
                missed:
                  type: integer
                  const: 0
            me:
              $ref: "#/components/schemas/ScoreEntry"
            ranking:
              type: array
              items:
                $ref: "#/components/schemas/ScoreEntry"

    GitLabConnectionSpike:
      type: object
      required: [configured, status, message, checkedAt, repositoryTree]
      properties:
        configured:
          type: boolean
        status:
          type: string
          enum: [CONNECTED, NOT_CONFIGURED]
        message:
          type: string
        checkedAt:
          type: string
          format: date-time
        user:
          type: [object, "null"]
          additionalProperties: true
        project:
          type: [object, "null"]
          additionalProperties: true
        repositoryTree:
          type: array
          items:
            $ref: "#/components/schemas/RepositoryTreeItem"
    GitLabFileContent:
      type: object
      required:
        [fileName, filePath, size, content, ref, blobId, commitId, lastCommitId]
      properties:
        fileName:
          type: string
        filePath:
          type: string
        size:
          type: integer
          format: int64
        content:
          type: string
        ref:
          type: string
        blobId:
          type: string
        commitId:
          type: string
        lastCommitId:
          type: string

security:
  - sessionCookie: []
