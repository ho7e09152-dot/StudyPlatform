openapi: 3.1.0
info:
  title: Study-ing API
  version: 0.2.0
  description: |
    Study-ing 프론트엔드와 Spring Boot 백엔드가 공유하는 API 계약입니다.

    구현 원칙:
    - GitLab access token은 브라우저에 반환하지 않습니다.
    - 인증된 API는 HttpOnly 세션 쿠키를 사용합니다.
    - Workspace ID로 연결 프로젝트를 결정하며 요청에서 임의 프로젝트를 받지 않습니다.
    - 날짜는 `YYYY-MM-DD`, 시각은 timezone을 포함한 ISO 8601 문자열입니다.
    - 수정 요청은 `expectedRevision` 또는 `lastCommitId`로 낙관적 잠금을 적용합니다.
  contact:
    name: Study-ing Team
servers:
  - url: http://localhost:8080/api/v1
    description: 로컬 개발 서버
tags:
  - name: Auth
    description: 팀원 1 담당 인증
  - name: GitLab Projects
    description: 팀원 1 담당 GitLab 프로젝트 선택
  - name: Workspaces
    description: 팀원 1 담당 Workspace와 멤버
  - name: Sessions
    description: 팀원 2 담당 일정과 session.yml
  - name: Repository
    description: 팀원 2 담당 저장소 읽기
  - name: Submissions
    description: 팀원 3 담당 멤버 제출
  - name: Analytics
    description: 팀원 3 담당 Dashboard, 기록, 점수
  - name: Team Feed
    description: Workspace 공지와 누적 팀 대화
  - name: Team Documents
    description: 학습 라이브러리의 공동 열람·작성자 전용 편집 문서
  - name: Connection Spike
    description: 공통 기반에서 이미 구현한 GitLab 읽기 진단 API

paths:
  /auth/gitlab/login:
    get:
      tags: [Auth]
      summary: GitLab OAuth 로그인 시작
      operationId: startGitLabLogin
      x-owner: member-1
      x-implementation-status: implemented
      security: []
      parameters:
        - name: returnUrl
          in: query
          required: false
          schema:
            type: string
            default: /
            pattern: ^/
          description: 로그인 완료 후 이동할 앱 내부 경로
      responses:
        "302":
          description: GitLab authorize URL로 이동
          headers:
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /auth/gitlab/callback:
    get:
      tags: [Auth]
      summary: GitLab OAuth callback 검증과 프론트 전환 화면 이동
      operationId: stageGitLabLogin
      x-owner: member-1
      x-implementation-status: implemented
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: 승인 코드를 서버 세션에 일회성으로 보관하고 프론트 `/auth/callback`으로 이동
          headers:
            Location:
              schema:
                type: string

  /auth/gitlab/complete:
    post:
      tags: [Auth]
      summary: 대기 중인 GitLab OAuth 승인 완료
      description: 서버 세션의 일회성 승인 코드를 소비해 token 교환, 사용자 저장, 세션 ID 회전을 완료합니다.
      operationId: completeGitLabLogin
      x-owner: member-1
      x-implementation-status: implemented
      parameters:
        - name: X-CSRF-TOKEN
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 로그인 완료 후 이동할 앱 내부 경로
          content:
            application/json:
              schema:
                type: object
                required: [returnUrl]
                properties:
                  returnUrl:
                    type: string
                    pattern: ^/
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /auth/me:
    get:
      tags: [Auth]
      summary: 현재 로그인 사용자 조회
      operationId: getCurrentUser
      x-owner: member-1
      x-implementation-status: implemented
      responses:
        "200":
          description: 현재 GitLab 로그인 사용자
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          description: 로그인 세션 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthenticatedResponse"

  /auth/logout:
    post:
      tags: [Auth]
      summary: 앱 세션 종료
      operationId: logout
      x-owner: member-1
      x-implementation-status: implemented
      responses:
        "204":
          description: 로그아웃 완료

  /auth/profile:
    put:
      tags: [Auth]
      summary: 가입 프로필 저장 또는 수정
      operationId: updateAccountProfile
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountProfileRequest"
      responses:
        "200":
          description: 저장된 서비스 프로필
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedGitLabUser"
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /auth/preferences:
    patch:
      tags: [Auth]
      summary: 개인 화면 테마 설정 저장
      operationId: updateAccountPreferences
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountPreferencesRequest"
      responses:
        "200":
          description: 변경된 사용자 프로필과 테마 설정
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedGitLabUser"
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /auth/account:
    delete:
      tags: [Auth]
      summary: 계정과 암호화 OAuth credential 삭제
      description: 활성 Workspace의 Owner는 먼저 해당 Workspace를 삭제해야 합니다. GitLab의 기존 파일과 commit은 삭제하지 않습니다.
      operationId: deleteAccount
      x-implementation-status: implemented
      responses:
        "204":
          description: 계정 삭제와 세션 종료 완료
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/csrf:
    get:
      tags: [Auth]
      summary: 세션 기반 변경 요청용 CSRF token 조회
      operationId: getCsrfToken
      x-owner: member-1
      x-implementation-status: implemented
      security: []
      responses:
        "200":
          description: CSRF header 이름과 token
          content:
            application/json:
              schema:
                type: object
                required: [token, headerName]
                properties:
                  token:
                    type: string
                  headerName:
                    const: X-CSRF-TOKEN

  /gitlab/projects:
    get:
      tags: [GitLab Projects]
      summary: 현재 사용자가 접근 가능한 GitLab 프로젝트 목록
      operationId: listGitLabProjects
      x-owner: member-1
      x-implementation-status: implemented
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: 프로젝트 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GitLabProject"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "502":
          $ref: "#/components/responses/GitLabError"

  /gitlab/projects/{projectId}/connection-check:
    get:
      tags: [GitLab Projects]
      summary: 프로젝트 연결 가능 여부 확인
      operationId: checkGitLabProjectConnection
      x-owner: member-1
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: OAuth 사용자의 프로젝트 조회 성공 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitLabConnectionSpike"
        "403":
          $ref: "#/components/responses/GitLabAccessDenied"
        "502":
          $ref: "#/components/responses/GitLabError"

  /gitlab/projects/{projectId}/repository/file:
    get:
      tags: [GitLab Projects]
      summary: OAuth 사용자 권한으로 프로젝트 파일 조회
      operationId: getOAuthGitLabProjectFile
      x-owner: member-1
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: path
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: ref
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Base64를 서버에서 디코딩한 텍스트 파일
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitLabFileContent"
        "400":
          $ref: "#/components/responses/InvalidPath"
        "403":
          $ref: "#/components/responses/GitLabAccessDenied"
        "502":
          $ref: "#/components/responses/GitLabError"

  /gitlab/projects/{projectId}/import-analysis:
    get:
      tags: [GitLab Projects]
      summary: 기존 저장소를 변경하지 않고 가져오기 가능 여부 분석
      operationId: analyzeGitLabRepository
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 저장소 분류, 호환 파일 수, 전용 경로 충돌과 tree fingerprint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryImportAnalysis"
        "403":
          $ref: "#/components/responses/GitLabAccessDenied"
        "413":
          $ref: "#/components/responses/InvalidRequest"

  /gitlab/connection:
    get:
      tags: [Connection Spike]
      summary: dev/local 환경변수 기반 GitLab 읽기 연결 진단
      operationId: getGitLabConnectionSpike
      x-owner: shared
      x-implementation-status: implemented
      description: 운영 프로필에는 등록되지 않는 PAT 연결 스파이크입니다.
      responses:
        "200":
          description: 현재 사용자·프로젝트·repository tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitLabConnectionSpike"
        "502":
          $ref: "#/components/responses/GitLabError"

  /gitlab/repository/file:
    get:
      tags: [Connection Spike]
      summary: dev/local 환경변수 프로젝트의 텍스트 파일 읽기
      operationId: getGitLabFileSpike
      x-owner: shared
      x-implementation-status: implemented
      description: 운영 프로필에는 등록되지 않는 PAT 연결 스파이크입니다.
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: 프로젝트 루트 기준 상대 경로
      responses:
        "200":
          description: Base64 디코딩된 파일
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitLabFileContent"
        "400":
          $ref: "#/components/responses/InvalidPath"
        "502":
          $ref: "#/components/responses/GitLabError"

  /workspaces:
    get:
      tags: [Workspaces]
      summary: 내 Workspace 목록
      operationId: listMyWorkspaces
      x-owner: member-1
      x-implementation-status: implemented-db-cache
      responses:
        "200":
          description: 활성 및 복구 가능한 Workspace 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/AuthRequired"
    post:
      tags: [Workspaces]
      summary: GitLab 프로젝트와 Workspace 연결
      operationId: createWorkspace
      x-owner: member-1
      x-implementation-status: implemented-db-cache
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: Workspace 생성 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /workspaces/deleted:
    get:
      tags: [Workspaces]
      summary: 현재 사용자가 복원할 수 있는 삭제 Workspace 목록
      operationId: listDeletedWorkspaces
      x-implementation-status: implemented
      responses:
        "200":
          description: 삭제 시각과 7일 복원 만료 시각을 포함한 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [workspace, deletedAt, deletionExpiresAt]
                  properties:
                    workspace:
                      $ref: "#/components/schemas/Workspace"
                    deletedAt:
                      type: string
                      format: date-time
                    deletionExpiresAt:
                      type: string
                      format: date-time

  /workspaces/discoverable:
    get:
      tags: [Workspaces]
      summary: Repository 멤버십으로 참여 가능한 Workspace 목록
      operationId: listDiscoverableWorkspaces
      x-implementation-status: implemented
      responses:
        "200":
          description: 현재 Provider 계정으로 접근 및 쓰기가 가능한 활성 Workspace만 반환
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [workspaceId, workspaceName, provider, repositoryId, repositoryPath, eligibility]
                  properties:
                    workspaceId: { type: string }
                    workspaceName: { type: string }
                    provider: { type: string, enum: [GITLAB] }
                    repositoryId: { type: string }
                    repositoryPath: { type: string }
                    defaultBranch: { type: string, nullable: true }
                    eligibility: { type: string, enum: [REPOSITORY_WRITE_CONFIRMED] }
        "401":
          $ref: "#/components/responses/AuthRequired"

  /workspaces/{workspaceId}/join:
    post:
      tags: [Workspaces]
      summary: Repository 멤버십 재검증 후 Workspace 참여
      operationId: joinWorkspace
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: MEMBER 역할로 참여했거나 이미 참여 중인 Workspace
          content:
            application/json:
              schema:
                type: object
                required: [workspace, joined]
                properties:
                  workspace:
                    $ref: "#/components/schemas/Workspace"
                  joined:
                    type: boolean
        "403":
          description: Repository 쓰기 권한 부족
        "404":
          description: 존재하지 않거나 현재 계정에서 발견할 수 없는 Workspace

  /workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Workspaces]
      summary: Workspace 상세
      operationId: getWorkspace
      x-owner: member-1
      x-implementation-status: implemented
      responses:
        "200":
          description: Workspace 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "403":
          $ref: "#/components/responses/WorkspaceAccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Workspaces]
      summary: Workspace 이름과 설정 수정
      operationId: updateWorkspace
      x-owner: member-1
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkspaceRequest"
      responses:
        "200":
          description: 수정된 Workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "403":
          $ref: "#/components/responses/WorkspaceAccessDenied"
    delete:
      tags: [Workspaces]
      summary: Workspace 소프트 삭제
      operationId: softDeleteWorkspace
      x-owner: member-1
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmationName]
              properties:
                confirmationName:
                  type: string
      responses:
        "204":
          description: 소프트 삭제 완료
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /workspaces/{workspaceId}/restore:
    post:
      tags: [Workspaces]
      summary: 삭제 후 7일 이내 Workspace 복원
      operationId: restoreWorkspace
      x-owner: member-1
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: 복원된 Workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "409":
          $ref: "#/components/responses/Conflict"

  /workspaces/{workspaceId}/member-candidates:
    get:
      tags: [Workspaces]
      summary: GitLab 프로젝트 멤버 후보
      operationId: listWorkspaceMemberCandidates
      x-owner: member-1
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Workspace 추가 가능 후보
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MemberCandidate"

  /workspaces/{workspaceId}/members:
    get:
      tags: [Workspaces]
      summary: Workspace 멤버 목록
      operationId: listWorkspaceMembers
      x-owner: member-1
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: 멤버 목록
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkspaceMember"
    post:
      tags: [Workspaces]
      summary: Workspace 멤버 추가
      operationId: addWorkspaceMember
      x-owner: member-1
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
      responses:
        "201":
          description: 추가된 멤버
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/WorkspaceMember"
        "409":
          $ref: "#/components/responses/Conflict"

  /workspaces/{workspaceId}/members/{userId}:
    delete:
      tags: [Workspaces]
      summary: Workspace 멤버 비활성화
      operationId: deactivateWorkspaceMember
      x-owner: member-1
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 비활성화 완료, 과거 제출은 유지

  /workspaces/{workspaceId}/members/{userId}/role:
    patch:
      tags: [Workspaces]
      summary: Owner가 Workspace 역할 변경
      description: 마지막 활성 Owner는 강등할 수 없습니다.
      operationId: updateWorkspaceMemberRole
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [OWNER, MANAGER, MEMBER]
      responses:
        "200":
          description: 역할이 변경된 Workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "409":
          $ref: "#/components/responses/Conflict"

  /workspaces/{workspaceId}/members/sync:
    post:
      tags: [Workspaces]
      summary: GitLab 프로젝트 멤버와 동기화
      operationId: syncWorkspaceMembers
      x-owner: member-1
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: 동기화 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberSyncResponse"

  /workspaces/{workspaceId}/sync:
    post:
      tags: [Workspaces, Sessions]
      summary: GitLab 원본에서 일정 파일 동기화
      description: Workspace 스키마에 따라 V1 YYMMDD/session.yml 또는 V2 .study-workspace/sessions/{연도}/{날짜}/session.yml 파일을 안전하게 검증해 반영하며, 잘못된 파일은 이전 정상 상태를 보존하고 failures에 반환합니다.
      operationId: syncWorkspaceSessions
      x-owner: member-2
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
