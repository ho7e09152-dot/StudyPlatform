        - $ref: "#/components/parameters/WorkspaceId"
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: 오늘 화면 집계
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"

  /workspaces/{workspaceId}/records:
    get:
      tags: [Analytics]
      summary: 일별 또는 월별 기록
