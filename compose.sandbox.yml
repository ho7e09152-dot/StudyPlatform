name: study-platform-sandbox

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - study-platform-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 150
    networks:
      - internal

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      FRONTEND_URL: ${SANDBOX_PUBLIC_ORIGIN}
      FRONTEND_ORIGINS: ${SANDBOX_PUBLIC_ORIGIN}
      GITLAB_OAUTH_REDIRECT_URI: ${SANDBOX_PUBLIC_ORIGIN}/api/v1/auth/gitlab/callback
      OAUTH_TOKEN_ENCRYPTION_KEY: ${OAUTH_TOKEN_ENCRYPTION_KEY}
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_READ_PER_MINUTE: "240"
      RATE_LIMIT_WRITE_PER_MINUTE: "60"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 250
    networks:
      - internal
      - egress

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${SANDBOX_PUBLIC_ORIGIN}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${SANDBOX_PUBLIC_ORIGIN}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 200
    networks:
      - internal

  gateway:
    image: nginx:1.29-alpine
    container_name: study-platform-gateway
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 80
    networks:
      - internal
      - npm-proxy

volumes:
  study-platform-postgres:

networks:
  internal:
    internal: true
  egress:
    driver: bridge
  npm-proxy:
    external: true
    name: npm-docker_default
