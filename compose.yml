name: study-workspace

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-study_workspace}
      POSTGRES_USER: ${POSTGRES_USER:-study}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-study-local-password}
      TZ: Asia/Seoul
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - study-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-study} -d ${POSTGRES_DB:-study_workspace}
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-study-local-redis-password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - study-redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a ${REDIS_PASSWORD:-study-local-redis-password} ping | grep PONG
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  study-postgres-data:
  study-redis-data:
