services:
  backend:
    # Run as the owner of the 0600 host PEM so the key stays private without making the image rootful.
    user: "${GITHUB_PRIVATE_KEY_UID:-1000}:${GITHUB_PRIVATE_KEY_GID:-1000}"
    volumes:
      - type: bind
        source: ${GITHUB_PRIVATE_KEY_HOST_PATH:?Set GITHUB_PRIVATE_KEY_HOST_PATH to the host PEM path}
        target: /run/secrets/study-ing-github-app.pem
        read_only: true
